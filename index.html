<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="control-panel">
        <div class="block"></div>
        <div class="block">
                <div class="force-container">
                    <p id="zero-force-lab" class="force-lab">ZERO</p>
                    <p id="zero-force-val" class="force-val">18.24</p>
                    <button class="button">SET ZERO</button>
                </div>
                <div id="rel-force-container" class="force-container">
                    <p id="rel-force-lab" class="force-lab">RELATIVE</p>
                    <p id="rel-force-val" class="force-val">02.53</p>
                    <button class="button">FULL SCREEN</button>
                </div>
                <div class="force-container">
                    <p id="abs-force-lab" class="force-lab">ABSOLUTE</p>
                    <p id="abs-force-val" class="force-val">20.77</p>
                    <button class="button">REMOVE ZERO</button>
                </div>
        </div>
        
        <div class="block">
                <div class="force-container">
                    <div class="force-header">
                        <p class="force-lab">MIN</p>
                        <button class="button">RESET</button>
                    </div>
                    <p class="force-val">01.24</p>
                </div>

                <div class="force-container">
                    <div class="force-header">
                        <p class="force-lab">MAX</p>
                        <button class="button">RESET</button>
                    </div>
                    <p class="force-val">76.23</p>
                </div>
        </div>
        <div class="block"></div>

    </div>

</body>
</html>
