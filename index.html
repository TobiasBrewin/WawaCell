<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Control Panel</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="control-panel">
        <div class="block">
                <div class="container">
                        <p class="label">DEVICE</p>
                        <p id="connection-value" class="text-value">No Device Connected</p>
                        <button id="connect-button"class="button" onclick="toggleConnection()">CONNECT</button>
                </div>
                <div class="container">
                    <p class="label">TIME</p>
                    <p id="time-value" class="text-value">-</p>
                    <button class="button">EDIT</button>
                </div>
                
                <div class="container">
                    <p class="label">UNIT</p>
                    <p id="unit-value" class="text-value">kN</p>
                    <button class="button">CYCLE UNIT</button>
                </div>
        </div>
        <div class="block">
                <div class="container">
                    <p id="zero-force-label" class="label">ZERO</p>
                    <p id="zero-force-value" class="force-value">-</p>
                    <button class="button" onclick="setZero()">SET ZERO</button>
                </div>
                <div id="rel-force-container" class="container">
                    <p id="rel-force-label" class="label">RELATIVE</p>
                    <p id="rel-force-value" class="force-value">-</p>
                    <button class="button">FULL SCREEN</button>
                </div>
                <div class="container">
                    <p class="label">ABSOLUTE</p>
                    <p id="abs-force-value" class="force-value">-</p>
                    <button class="button" onclick="removeZero()">REMOVE ZERO</button>
                </div>
        </div>
        
        <div class="block">
                <div class="container">
                    <div class="force-header">
                        <p class="label">MIN</p>
                        <button class="button" onclick="setMin()">RESET</button>
                    </div>
                    <p id="min-force-value" class="force-value">-</p>
                </div>

                <div class="container">
                    <div class="force-header">
                        <p class="label">MAX</p>
                        <button class="button" onclick="setMax()">RESET</button>
                    </div>
                    <p id="max-force-value" class="force-value">-</p>
                </div>
        </div>
        <div class="block">
            <canvas id="chart" width="900" height="400"></canvas>
        </div>

    </div>

</body>
</html>
