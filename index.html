<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="control-panel">
        <div class="block">
                <div class="force-container">
                    <p id="zero-force-lab"class="force-lab">0 Offset</p>
                    <p id="zero-force-val"class="force-val">18.24</p>
                    <button class="button">Set 0 Offset</button>
                </div>
                <div class="force-container">
                    <p id="rel-force-lab" class="force-lab">Relative</p>
                    <p id="rel-force-val" class="force-val">02.53</p>
                    <button class="button">Full Screen</button>
                </div>
                <div class="force-container">
                    <p id="abs-force-lab" class="force-lab">Absolute</p>
                    <p id="abs-force-val" class="force-val">20.77</p>
                    <button class="button">Remove 0 Offset</button>
                </div>
        </div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>

    </div>

</body>
</html>
